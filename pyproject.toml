[project]
name = "linkedin-scraper"
version = "0.1.0"
description = "HTTP-requests-based LinkedIn scraper using session cookies from Firefox"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "requests>=2.32.0",
    "beautifulsoup4>=4.12.0",
]

[project.scripts]
linkedin-scraper = "linkedin_scraper.cli:main"
